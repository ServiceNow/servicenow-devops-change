# Example: ServiceNow DevOps Change with HTTPS Proxy Support
#
# This workflow demonstrates how to route the ServiceNow DevOps Change action
# through a corporate HTTPS proxy. The action reads the HTTPS_PROXY environment
# variable and tunnels all requests via HTTP CONNECT.
#
# Required secrets:
#   HTTPS_PROXY_URL           - Proxy URL, e.g. http://<host>:<port> or http://user:pass@<host>:<port>
#   SN_INSTANCE_URL           - ServiceNow instance URL
#   SN_DEVOPS_INTEGRATION_TOKEN - DevOps integration token
#   SN_ORCHESTRATION_TOOL_ID  - Orchestration tool sys_id

name: Proxy Test - DevOps Change

on:
  workflow_dispatch:

jobs:

  changeApproval:
    name: ServiceNow Change Approval
    runs-on: ubuntu-latest

    # Set HTTPS_PROXY so the action routes traffic through your proxy
    env:
      HTTPS_PROXY: ${{ secrets.HTTPS_PROXY_URL }}

    steps:
      - name: ServiceNow Change Approval
        uses: ServiceNow/servicenow-devops-change@feature/https-proxy-agent
        id: create
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'ServiceNow Change Approval'
          change-request: '{"setCloseCode":"true","attributes":{"short_description":"Automated Software Deployment","description":"Automated Software Deployment.","assignment_group":"a715cd759f2002002920bde8132e7018","implementation_plan":"Software update is tested and results can be found in Test Summaries Tab.","backout_plan":"When software fails in production, the previous software release will be re-deployed.","test_plan":"Testing if the software was successfully deployed"}}'
          interval: '100'
          timeout: '3600'
          changeCreationTimeOut: '3600'
          abortOnChangeCreationFailure: true
          abortOnChangeStepTimeout: true

      - name: Output of Change Creation
        run: echo "change-request-number=${{ steps.create.outputs.change-request-number }} change-request-sys-id=${{ steps.create.outputs.change-request-sys-id }}"
